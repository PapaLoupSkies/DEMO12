{% extends "base.html" %}
{% block title %}People — Knowledge Platform{% endblock %}

{% block extra_head %}
<style>
  .people-grid { padding: 16px 24px 40px; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .person-card { background: var(--white); border: 1px solid var(--border); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 10px; transition: box-shadow .15s; }
  .person-card:hover { box-shadow: 0 2px 12px rgba(0,107,94,.1); border-color: #b3d9d4; }
  .person-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--accent-light); display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; color: var(--accent); flex-shrink: 0; }
  .person-header { display: flex; align-items: center; gap: 10px; }
  .person-name { font-weight: 600; font-size: 13px; color: var(--text); }
  .person-role { font-size: 11px; color: var(--text-muted); }
  .person-meta { display: flex; flex-direction: column; gap: 4px; }
  .person-meta-row { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-muted); }
  .person-meta-row strong { color: var(--text); font-weight: 500; }
  .person-actions { display: flex; gap: 6px; }
  .btn-pdf { padding: 5px 12px; border-radius: 6px; font-size: 11px; font-weight: 500; font-family: 'Inter', sans-serif; cursor: pointer; border: 1px solid var(--accent); background: var(--accent-light); color: var(--accent); }
  .btn-pdf:hover { background: var(--accent); color: #fff; }

  /* PDF viewer modal */
  .pdf-modal { background: var(--white); border-radius: 12px; width: 680px; max-width: 95vw; max-height: 85vh; display: flex; flex-direction: column; box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .pdf-modal-header { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .pdf-modal-title { font-weight: 600; font-size: 14px; }
  .pdf-close { background: none; border: none; font-size: 18px; cursor: pointer; color: var(--text-muted); }
  .pdf-frame { flex: 1; width: 100%; border: none; min-height: 500px; }
  /* Org Chart block */
  .org-block { background:var(--white); border:1px solid var(--border); border-radius:10px; margin:16px 24px 0; overflow:hidden; }
  .org-block-header { padding:10px 16px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border); background:var(--bg); cursor:pointer; }
  .org-block-title { font-size:13px; font-weight:600; color:var(--text); display:flex; align-items:center; gap:8px; }
  .org-block-toggle { font-size:11px; color:var(--text-muted); border:1px solid var(--border); border-radius:5px; padding:3px 8px; background:var(--white); cursor:pointer; font-family:'Inter',sans-serif; }
  .org-block-toggle:hover { border-color:var(--accent); color:var(--accent); }
  .org-iframe-wrap { height:560px; transition:height .3s; overflow:hidden; background:#f0f0ec; }
  .org-iframe-wrap.collapsed { height:0; }
  .pdf-canvas-wrap { display:flex; align-items:flex-start; justify-content:center; overflow:auto; height:100%; padding:16px; position:relative; }
  .pdf-canvas-wrap canvas { box-shadow:0 2px 16px rgba(0,0,0,.18); background:#fff; border-radius:2px; }
  .pdf-loading { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:13px; color:var(--text-muted); }
  .pdf-toolbar { display:flex; align-items:center; gap:4px; }
  .pdf-tb-btn { width:28px; height:28px; border:1px solid var(--border); border-radius:5px; background:var(--white); font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--text-muted); text-decoration:none; font-family:'Inter',sans-serif; }
  .pdf-tb-btn:hover { border-color:var(--accent); color:var(--accent); }
  .pdf-page-info { font-size:12px; color:var(--text-muted); padding:0 6px; min-width:52px; text-align:center; }
  .pdf-zoom-lbl { font-size:11px; color:var(--text-muted); min-width:38px; text-align:center; }
  .pdf-tb-sep { width:1px; height:18px; background:var(--border); margin:0 3px; }
</style>
{% endblock %}

{% block content %}
<!-- ORG CHART BLOCK — PDF.js viewer -->
<div class="org-block" id="org-block">
  <div class="org-block-header">
    <span class="org-block-title">🏢 Organisation Chart
      <span style="font-size:10px;font-weight:400;color:var(--text-muted)">— Structure 2026</span>
    </span>
    <div class="pdf-toolbar" onclick="event.stopPropagation()">
      <button class="pdf-tb-btn" id="pdf-prev" onclick="pdfPrev()" title="Previous page">&#8249;</button>
      <span class="pdf-page-info"><span id="pdf-cur">1</span> / <span id="pdf-total">1</span></span>
      <button class="pdf-tb-btn" id="pdf-next" onclick="pdfNext()" title="Next page">&#8250;</button>
      <div class="pdf-tb-sep"></div>
      <button class="pdf-tb-btn" onclick="pdfZoom(-0.2)" title="Zoom out">−</button>
      <span class="pdf-zoom-lbl" id="pdf-zoom-lbl">100%</span>
      <button class="pdf-tb-btn" onclick="pdfZoom(0.2)" title="Zoom in">+</button>
      <div class="pdf-tb-sep"></div>
      <a class="pdf-tb-btn" href="/docs/org_chart.pdf" download title="Download">⤓</a>
      <a class="pdf-tb-btn" href="/docs/org_chart.pdf" target="_blank" title="Open in new tab">↗</a>
      <button class="org-block-toggle" id="org-toggle-btn" onclick="toggleOrg()">▲ Collapse</button>
    </div>
  </div>
  <div class="org-iframe-wrap" id="org-iframe-wrap">
    <div class="pdf-canvas-wrap" id="pdf-canvas-wrap">
      <canvas id="pdf-canvas"></canvas>
      <div class="pdf-loading" id="pdf-loading">Loading document…</div>
    </div>
  </div>
</div>

<div class="controls">
  <div class="search-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="text" id="search" placeholder="Search by name, team, department...">
  </div>
  <select id="filter-dept" onchange="onDeptFilter()">
    <option value="">All Departments</option>
  </select>
  <select id="filter-team" onchange="renderPeople()">
    <option value="">All Teams</option>
  </select>
  <div class="count-badge">Results: <span id="result-count">—</span></div>
</div>

<div class="people-grid" id="people-grid">
  <div class="loading" style="grid-column:1/-1">Loading people...</div>
</div>

{% endblock %}

{% block scripts %}
<script src="/static/pdfjs/pdf.min.js"></script>
<script>
let ALL_EMP = [], taxonomy = {};

async function initPeople() {
  const [empRes, taxRes] = await Promise.all([fetch('/api/people'), fetch('/api/taxonomy')]);
  const empData = await empRes.json();
  const taxData = await taxRes.json();
  ALL_EMP = empData.employees;
  taxonomy = taxData.taxonomy;

  const dSel = document.getElementById('filter-dept');
  [...new Set(ALL_EMP.map(e=>e.Department).filter(Boolean))].sort().forEach(d=>{
    dSel.innerHTML += `<option value="${esc(d)}">${esc(d)}</option>`;
  });
  renderPeople();
}

function onDeptFilter() {
  const dept = document.getElementById('filter-dept').value;
  const tSel = document.getElementById('filter-team');
  tSel.innerHTML = '<option value="">All Teams</option>';
  if (dept && taxonomy[dept]) {
    const teams = Object.values(taxonomy[dept]).flat().sort();
    teams.forEach(t => tSel.innerHTML += `<option value="${esc(t)}">${esc(t)}</option>`);
  }
  renderPeople();
}

function renderPeople() {
  const q    = document.getElementById('search').value.toLowerCase().trim();
  const dept = document.getElementById('filter-dept').value;
  const team = document.getElementById('filter-team').value;

  let data = ALL_EMP.filter(e => {
    if (dept && e.Department !== dept) return false;
    if (team && e.Team !== team) return false;
    if (q && !Object.values(e).join(' ').toLowerCase().includes(q)) return false;
    return true;
  });

  document.getElementById('result-count').textContent = data.length;
  const grid = document.getElementById('people-grid');

  if (!data.length) {
    grid.innerHTML = '<p style="grid-column:1/-1;color:var(--text-muted);text-align:center;padding:40px">No results found.</p>';
    return;
  }

  grid.innerHTML = data.map(e => {
    const initials = (e['Employee Name']||'?').split(' ').map(n=>n[0]).join('').slice(0,2).toUpperCase();
    return `<div class="person-card">
      <div class="person-header">
        <div class="person-avatar">${initials}</div>
        <div>
          <div class="person-name">${esc(e['Employee Name'])}</div>
          <div class="person-role">${esc(e['Activity Sub Category']||e['Activity Category']||'')}</div>
        </div>
      </div>
      <div class="person-meta">
        <div class="person-meta-row">🏢 <strong>${esc(e.Department||'')}</strong></div>
        <div class="person-meta-row">📂 ${esc(e['Sub Department']||'')} → <strong>${esc(e.Team||'')}</strong></div>
        <div class="person-meta-row">🌍 <span class="badge badge-category">${esc(e.Workscope||'')}</span></div>
        ${e.Manager ? `<div class="person-meta-row">👤 Manager: <strong>${esc(e.Manager)}</strong></div>` : ''}
      </div>
    </div>`;
  }).join('');
}



document.getElementById('search').addEventListener('input', renderPeople);
initPeople();

// ── PDF.js Viewer ─────────────────────────────────────────────
let pdfDoc = null, pdfPage = 1, pdfScale = 1.2;

async function initPdfViewer() {
  const loadingEl = document.getElementById('pdf-loading');
  try {
    // Chercher pdfjsLib sous tous ses noms possibles
    const lib = window.pdfjsLib
             || window['pdfjs-dist/build/pdf']
             || window['pdfjs'];
    if (!lib) {
      // Dernier recours : attendre 500ms et réessayer
      loadingEl.textContent = 'Initializing...';
      setTimeout(initPdfViewer, 500);
      return;
    }
    lib.GlobalWorkerOptions.workerSrc = '/static/pdfjs/pdf.worker.min.js';
    const task = lib.getDocument('/docs/org_chart.pdf');
    pdfDoc = await task.promise;
    document.getElementById('pdf-total').textContent = pdfDoc.numPages;
    loadingEl.style.display = 'none';
    await renderPage(pdfPage);
  } catch(e) {
    console.error('PDF.js error:', e);
    loadingEl.textContent = 'Cannot display PDF — ';
    const link = document.createElement('a');
    link.href = '/docs/org_chart.pdf';
    link.target = '_blank';
    link.textContent = 'Download instead';
    link.style.color = 'var(--accent)';
    loadingEl.appendChild(link);
  }
}

async function renderPage(num) {
  const page = await pdfDoc.getPage(num);
  const viewport = page.getViewport({ scale: pdfScale });
  const canvas = document.getElementById('pdf-canvas');
  const ctx = canvas.getContext('2d');
  canvas.height = viewport.height;
  canvas.width  = viewport.width;
  await page.render({ canvasContext: ctx, viewport }).promise;
  document.getElementById('pdf-cur').textContent = num;
  document.getElementById('pdf-zoom-lbl').textContent = Math.round(pdfScale * 100) + '%';
  document.getElementById('pdf-prev').disabled = num <= 1;
  document.getElementById('pdf-next').disabled = num >= pdfDoc.numPages;
}

async function pdfPrev() { if (pdfPage > 1) { pdfPage--; await renderPage(pdfPage); } }
async function pdfNext() { if (pdfDoc && pdfPage < pdfDoc.numPages) { pdfPage++; await renderPage(pdfPage); } }
async function pdfZoom(delta) {
  pdfScale = Math.min(3, Math.max(0.4, pdfScale + delta));
  await renderPage(pdfPage);
}

function toggleOrg() {
  const wrap = document.getElementById('org-iframe-wrap');
  const btn  = document.getElementById('org-toggle-btn');
  const collapsed = wrap.classList.toggle('collapsed');
  btn.textContent = collapsed ? '▼ Expand' : '▲ Collapse';
}

// PDF viewer init — appelé après déclaration de toutes les fonctions

// Lancer le viewer PDF
initPdfViewer();
</script>
{% endblock %}
